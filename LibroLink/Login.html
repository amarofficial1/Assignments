<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body bgcolor="#003366">
    <font color="#FFFAFA">
        <center>
        <img src="./front page photos/logo.png" alt="libra app logo" height="260" width="260"><br>
        <form action="./Homepage.html">
            <table cellspacing="3">
                <tr>
                    <td><h3>Email:</h3></td>

                        <input type="email" placeholder="enter a valid email." required>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Login">
                    </td>
                </tr>
            </table><br>
            <b>Don't have an account?</b>
            <b><a href="./Signup.html"><font color="red">Signup </font></a></b>
        </form>
        
        </center>
    </font>

</html>
