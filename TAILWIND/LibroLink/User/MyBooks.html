<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My books</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-sky-900 text-white">
    <form action="Search.html">
    <div class="bg-black flex justify-between items-center">
            <img src="./front page photos/logo.png" alt="logo" class="w-20 h-14">
        <div class="">
            <ul class="list-none flex mx-2">
               <li class="mx-4"><a href="Homepage.html" class="font-semibold hover:text-red-700">Home</a></li>
                <li class="mx-4"><a href="Viewbook.html"class="font-semibold  hover:text-red-700">ViewBook</a></li>
                <li class="mx-4"><a href="MyBooks.html"class="font-semibold  hover:text-red-700">MyBooks</a></li>
                <li class="mx-4"><a href="Login.html" class="font-semibold hover:text-red-700">Logout</a></li>
            </ul>
        </div>
    </div> 
    <div class="w-350 mx-auto my-10 bg-black border-1 border-white px-20">
        <div class="flex  w-160 m-auto my-10">
            <input type="text" placeholder="enter the authorname/bookname/si no." required class="p-2 w-130 border-none bg-white text-gray-700 font-semibold my-3 rounded-md hover:opacity-90">
            <input type="submit" value="Search" class="bg-slate-700 ml-5 px-5 py-2 font-bold text-lg rounded-md border-orange-600 border-2 my-5 hover:bg-slate-800">
        </div>
        <h1 class="text-center text-yellow-300 font-semibold underline underline-offset-9 text-4xl mb-10">My Books</h1>
        <table class="border-2 border-green-500 text-center m-auto mb-20">
           <tr class="border-2 border-green-500">
            <td class="border-2 border-green-500 p-3 text-pink-600"><h3>SI No.</h3></td>
            <td class="border-2 border-green-500 p-3 text-pink-600"><h3>Book Name</h3></td>
            <td class="border-2 border-green-500 p-3 text-pink-600"><h3>Author Name</h3></td>
            <td class="border-2 border-green-500 p-3 text-pink-600"><h3>Issued Date</h3></td>
            <td class="border-2 border-green-500 p-3 text-pink-600"><h3>Return Date</h3></td>
            <td class="border-2 border-green-500 p-3 text-pink-600"><h3>Status</h3></td>

           </tr>
           <tr class="border-2 border-green-500">
            <td class="border-2 border-green-500 p-3">1.</td>
            <td class="border-2 border-green-500 p-3">Treasure Island</td>
            <td class="border-2 border-green-500 p-3">Robert louis Stevenson</td>
            <td class="border-2 border-green-500 p-3">29-09-2026</td>
            <td class="border-2 border-green-500 p-3">09-10-2026</td>
            <td class="border-2 border-green-500 p-3"><font color="orange">Returned</font></td>
        </tr>
        <tr class="border-2 border-green-500">
            <td class="border-2 border-green-500 p-3">2.</td>
            <td class="border-2 border-green-500 p-3">Dracula</td>
            <td class="border-2 border-green-500 p-3">Bram Stocker</td>
            <td class="border-2 border-green-500 p-3">05-10-2026</td>
            <td class="border-2 border-green-500 p-3">15-10-2026</td>
            <td class="border-2 border-green-500 p-3"><font color="gray">not Returned</font></td>
        </tr>
           
        </table>
    </div>
</form>
</body>
</html>
