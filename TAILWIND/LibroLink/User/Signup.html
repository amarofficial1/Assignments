<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-sky-900 text-white">
<form action="Login.html">
    <div class="bg-black">
            <img src="./front page photos/logo.png" alt="logo" class="w-20 h-14">
    </div> 
    <div class="w-170 mx-auto my-10 bg-black border-1 border-white px-20">
        <img src="./front page photos/logo.png" alt="libra app logo" class="w-100 h-70 mx-auto">
        <h1 class="text-center text-yellow-300 font-semibold underline underline-offset-10 text-4xl mb-10">Signup</h1>
        <h3 class="text-xl font-semibold">Name:</h3>
        <input type="text" placeholder="enter your name." required class="p-2 w-130 border-none bg-white text-gray-700 font-semibold my-3 rounded-md hover:opacity-80">
        <h3 class="text-xl font-semibold">Rollno:</h3>
        <input type="text" placeholder="enter your rollno." required class="p-2 w-130 border-none bg-white text-gray-700 font-semibold my-3 rounded-md hover:opacity-80">
        <h3 class="text-xl font-semibold">Class:</h3>
        <select name="class" class="p-2 w-130 border-none bg-white text-gray-700 font-semibold my-3 rounded-md hover:opacity-80">
            <option value="bca">BCA</option>
            <option value="mca">MCA</option>
            <option value="bsccs">Bsc.CS</option>
            <option value="bcom">Bcom</option>
            <option value="mcom">Mcom</option>
            <option value="baenglish">BA.English</option>
            <option value="bahindi">BA.Hindi</option>
            <option value="bamalayalam">BA.Malayalam</option>
        </select>
        <h3 class="text-xl font-semibold">Department:</h3>
        <select name="Department" class="p-2 w-130 border-none bg-white text-gray-700 font-semibold my-3 rounded-md hover:opacity-80">
            <option value="computersciene">Department of ComputerScience</option>
            <option value="commerce">Department of Commerce</option>
            <option value="literature">Department of literature</option>
        </select>
        <h3 class="text-xl font-semibold">Email:</h3>
        <input type="email" placeholder="enter a valid email." required class="p-2 w-130 border-none bg-white text-gray-700 font-semibold my-3 rounded-md hover:opacity-80">
         <h3 class="text-xl font-semibold">Password:</h3>
        <input type="password" placeholder="enter your password." required class="p-2 w-130 border-none bg-white text-gray-700 font-semibold my-3 rounded-md hover:opacity-80">
        <div class="w-130 flex justify-between items-center mb-5">
            <input type="submit" value="Signup" class="bg-slate-700 px-5 py-2 font-bold text-lg rounded-md border-orange-600 border-2 my-5 hover:bg-slate-800">
            <h1>Already have an account? <a href="Login.html" class="text-red-300 font-bold hover:text-red-700">Login</a></h1>
        </div>
    </div>

    
</form>
</body>
</html>
