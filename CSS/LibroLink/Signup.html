<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="./style/signup.css">
</head>
<body>
  <form action="Login.html">
    <div class="nav">
        <div>
            <img src="./front page photos/logo.png" alt="logo">
        </div>
    </div>
    <div class="body">  
    <div class="main">
        <img src="./front page photos/logo.png" alt="logo">
        <h1>Signup</h1>
    </div>
    <div class="b1">
        <h3>Name:</h3>
        <input type="text" placeholder="enter your name." required class="b2">
         <h3>Rollno:</h3>
        <input type="text" placeholder="enter your rollno." required class="b2">
        <h3>Class:</h3>
        <select name="class" class="b2">
            <option value="bca">BCA</option>
            <option value="mca">MCA</option>
            <option value="bsccs">Bsc.CS</option>
            <option value="bcom">Bcom</option>
            <option value="mcom">Mcom</option>
            <option value="baenglish">BA.English</option>
            <option value="bahindi">BA.Hindi</option>
            <option value="bamalayalam">BA.Malayalam</option>
        </select>
        <h3>Department:</h3>
        <select name="Department" class="b2">
            <option value="computersciene">Department of ComputerScience</option>
            <option value="commerce">Department of Commerce</option>
            <option value="literature">Department of literature</option>
        </select>
        <h3>Email:</h3>
        <input type="email" placeholder="enter a valid email." required class="b2">
         <h3>Password:</h3>
        <input type="password" placeholder="enter your password." required class="b2">
        <div class="opt1">
            <div><input type="submit" value="Signup" class="signup"></div>
            <div class="login">Already have an account? <a href="./Login.html">Login</a></div>
        </div>    
    </div>
    </div>
   </div> 
</form>
</body>
</html>
