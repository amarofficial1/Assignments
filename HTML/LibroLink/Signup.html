<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>
<body bgcolor="#003366">
    <font color="#FFFAFA">
        <center>
        <img src="./front page photos/logo.png" alt="libra app logo" height="260" width="260"><br>
        <form action="./Login.html">
            <table cellspacing="3">
                <tr>
                    <td><h3>Name:</h3></td>
                    <td>
                        <input type="text" placeholder="enter your name" required>
                    </td>
                </tr>
                <tr>
                    <td><h3>Rollno:</h3></td>
                    <td>
                        <input type="number" placeholder="enter your roll number">
                    </td>
                </tr>
                <tr>
                    <td><h3>Class:</h3></td>
                    <td>
                        <select name="class">
                            <option value="bca">BCA</option>
                            <option value="mca">MCA</option>
                            <option value="bsccs">Bsc.CS</option>
                            <option value="bcom">Bcom</option>
                            <option value="mcom">Mcom</option>
                            <option value="baenglish">BA.English</option>
                            <option value="bahindi">BA.Hindi</option>
                            <option value="bamalayalam">BA.Malayalam</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><h3>Department:</h3></td>
                    <td>
                        <select name="department">
                            <option value="computersciene">Department of ComputerScience</option>
                            <option value="commerce">Department of Commerce</option>
                            <option value="literature">Department of literature</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><h3>Email:</h3></td>
                    <td>
                        <input type="email" placeholder="enter a valid email." required>
                    </td>
                </tr>
                <tr>
                    <td><h3>Password:</h3></td>
                    <td>
                        <input type="password" placeholder="enter your password" required>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Signup">
                    </td>
                </tr>
            </table><br>
            <b>Already have an account?</b>
            <b><a href="./Login.html"><font color="red">Login </font></a></b>
        </form>
        
        </center>
    </font>
</body>
</html>
