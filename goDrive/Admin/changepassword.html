<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changepassword</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-cyan-100">
    <form action="login.html">
    <div class="bg-black text-white">
        <img src="newlogo.png" alt="logo" class="w-25 h-15">
    </div>
    <img src="newlogo.png" alt="logo" class="w-100 h-70 mx-auto">
   <div class="w-140 bg-white mx-auto -mt-20 mb-20 py-5 px-18 rounded-2xl shadow-xl">
        <div class="font-bold text-center text-4xl my-7 text-yellow-400">Change Password</div>
        <div class="font-bold text-xl ">New Password:</div>
        <input type="password" required placeholder="enter the new password" class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
        <div class="font-bold text-xl">Re-enter New Password:</div>
        <input type="password" required placeholder="re-enter the new password" class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
        <div class="mt-5 mb-7 flex justify-between items-center">
            <input type="submit" value="Change Password" class=" bg-blue-500 py-2 px-6 rounded-lg font-bold text-lg text-white hover:bg-blue-600">
            <h1 class="text-red-500 font-semibold hover:text-red-700 text-xl underline underline-offset-6"><a href="login.html">Login?</a></h1>
        </div>
        
    </div>
    </form>
</body>

</html>
