<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grab a ride</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-cyan-100">
    <form action="confirmation.html">
        <div class="bg-black text-white flex justify-between items-center">
            <img src="newlogo.png" alt="logo" class="w-25 h-15">
            <div>
                <ul class="list-none flex">
                   <li class="px-2"><a href="homepage.html" class="hover:text-red-600 font-medium">Home</a></li>
                <li class="px-2"><a href="profile.html" class="hover:text-red-600  font-medium">Profile</a></li>
                <li class="px-2"><a href="booking.html" class="hover:text-red-600  font-medium">Grab a ride</a></li>
                <li class="px-2"><a href="history.html" class="hover:text-red-600  font-medium">History</a></li>
                <li class="px-2"><a href="complaints.html" class="hover:text-red-600  font-medium">Complaints</a></li>
                <li class="px-2"><a href="contactus.html" class="hover:text-red-600  font-medium">Contact us</a></li>
                <li class="px-2"><a href="login.html" class="hover:text-red-600  font-medium">Logout</a></li>
                </ul>
            </div>
        </div>

        <div class="w-250 bg-white border-2 border-black mx-auto my-30 rounded-xl shadow-xl px-40">
            <h1 class="font-bold text-4xl underline underline-offset-9 text-red-500 text-center my-10 italic">Book your
                Ride</h1>
            <div class="font-bold text-xl ">Travelling From:</div>
            <input type="text" required placeholder="enter pickup location"
                class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
            <div class="font-bold text-xl ">Travelling To:</div>
            <input type="text" required placeholder="enter destination"
                class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
            <div class="font-bold text-xl ">Date:</div>
            <input type="datetime-local" required
                class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
            <div class="font-bold text-xl ">Vehicle Type:</div>
            <select name="vehicle"
                class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
                <option value="car">Car</option>
                <option value="bike">Bike</option>
                <option value="rikshaw">Rikshaw</option>
            </select>
            <div class="font-bold text-xl ">Seats:</div>
            <select name="seater"
                class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
                <option value="1" selected disabled>1-seater</option>
                <option value="2">2-seater</option>
                <option value="3">3-seater</option>
                <option value="4">4-seater</option>
                <option value="5">5-seater</option>
                <option value="6">6-seater</option>
            </select>
            <input type="submit" value="Booknow"
                class=" bg-red-500 py-2 px-6 rounded-lg font-bold text-lg text-white hover:bg-red-600 mt-5 mb-10">
        </div>
        </div>
    </form>
</body>

</html>
