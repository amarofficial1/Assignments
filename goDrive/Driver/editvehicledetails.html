<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Vehicle Details</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-cyan-100">
    <form action="vehicledetails.html">
        <div class="bg-black text-white flex justify-between items-center">
            <img src="newlogo.png" alt="logo" class="w-25 h-15">
            <div>
                <ul class="list-none flex">
                   <li class="px-2"><a href="homepage.html" class="hover:text-red-600 font-medium">Home</a></li>
                <li class="px-2"><a href="profile.html" class="hover:text-red-600  font-medium">Profile</a></li>
                <li class="px-2"><a href="rides.html" class="hover:text-red-600  font-medium">Rides</a></li>
                <li class="px-2"><a href="history.html" class="hover:text-red-600  font-medium">History</a></li>
                <li class="px-2"><a href="complaints.html" class="hover:text-red-600  font-medium">Complaints</a></li>
                <li class="px-2"><a href="contactus.html" class="hover:text-red-600  font-medium">Contact us</a></li>
                <li class="px-2"><a href="login.html" class="hover:text-red-600  font-medium">Logout</a></li>
                </ul>
            </div>
        </div>

        <div class="w-250 bg-white border-2 border-black mx-auto my-30 rounded-xl shadow-xl px-40">
            <h1 class="font-bold text-4xl underline underline-offset-9 text-red-500 text-center my-10 italic">Edit
                Vehicle Details</h1>
            <div class="font-bold text-xl ">Vehicle No:</div>
            <input type="text" required placeholder="enter your vehicle registration no."
                class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
<div class="font-bold text-xl ">Vehicle Type:</div>
            <input type="text" required placeholder="car/bike/scooter/rikshaw."
                class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">           
                 <div class="font-bold text-xl ">Seating Capacity:</div>
            <input type="text" required placeholder="enter the maximum seating capacity"
                class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
                <div class="font-bold text-xl ">Model & Color:</div>
            <input type="text" required placeholder="enter your vehicle model & color."
                class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
            <div class="my-10 flex justify-between items-center">
                <input type="submit" value="Save Changes"
                    class=" bg-purple-500 py-2 px-6 rounded-lg font-bold text-lg text-white hover:bg-purple-600">
                    <a href="vehicledetails.html" class=" bg-red-500 py-2 px-6 rounded-lg font-bold text-lg text-white hover:bg-red-600">Cancel</a>
            
                </div>
        </div>
    </form>
</body>

</html>
