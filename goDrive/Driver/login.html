<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-cyan-100">
    <form action="homepage.html">
     <div class="bg-black text-white flex justify-between items-center">
            <img src="newlogo.png" alt="logo" class="w-25 h-15">
            <ul class="list-none flex">
                <li class="px-2"><a href="../landingpage.html" class="hover:text-red-600 font-medium">Home</a></li>
                <li class="px-2"><a href="../contactus.html" class="hover:text-red-600  font-medium">Contact us</a>
                </li>
            </ul>
        </div>

    <img src="newlogo.png" alt="logo" class="w-100 h-70 mx-auto">
   <div class="w-140 bg-white mx-auto -mt-20 py-5 px-18 rounded-2xl shadow-xl">
        <div class="font-bold text-center text-4xl my-7 text-yellow-400">Login</div>
        <div class="font-bold text-xl ">Email:</div>
        <input type="email" required placeholder="enter your email" class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
        <div class="font-bold text-xl">Password:</div>
        <input type="password" required placeholder="enter the password" class="bg-white border-2 border-slate-200 w-full my-3 p-2 rounded-md shadow-sm placeholder:italic">
        <div class="mt-5 mb-7 flex justify-between items-center">
            <input type="submit" value="Login" class=" bg-purple-500 py-2 px-10 rounded-lg font-bold text-lg text-white hover:bg-purple-600">
            <h1 class="text-red-500 font-semibold hover:text-red-700"><a href="resetpassword.html">forgot password?</a></h1>
        </div>
        <h1 class=" font-semibold text-center">
                        Don't have an Account?<a href="signup.html" class="text-red-500 hover:text-red-700"> Signup</a></h1>

    </div>
    </form>
</body>

</html>
